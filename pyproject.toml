[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synapsys-memory"
version = "0.2.0.dev4"
description = "Memoria local, independiente y modular para asistentes de IA"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary - all rights reserved"}
authors = [{name = "Frosst43"}]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.28,<2"]

[project.scripts]
synapsys-memory = "synapsys_memory.cli:main"
synapsys-memory-mcp = "synapsys_memory.mcp_server:main"
synapsys-memory-broker = "synapsys_memory.broker_cli:main"
synapsys-memory-sandbox = "synapsys_memory.sandbox:main"

[tool.setuptools.packages.find]
where = ["src"]
