name: SynapSyS-MemorY v0.2 validation

on:
  pull_request:
  push:
    branches:
      - experiment/v02-permissions-mcp-migration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MCP adapter
        run: python -m pip install -e '.[mcp]'
      - name: Unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Real MCP stdio protocol handshake
        run: python scripts/verify_mcp_stdio.py
